[project]
name = "linux-use"
version = "0.1.0"
description = "Accessibility-tree desktop agent (Linux AT-SPI, Windows UIA, macOS AX) with a hybrid cache/locmap policy; CLI, Python, JSON-RPC, and MCP for any agent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "linux-use authors" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
linux = []
windows = ["comtypes>=1.2"]
macos = [
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
]
dev = ["pytest>=7.0"]

[project.scripts]
linux-use = "linux_use.cli:main"
desktop-use = "linux_use.cli:main"

[project.urls]
Homepage = "https://github.com/mumu-2025/linux-use"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["linux_use*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
