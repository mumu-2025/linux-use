[project]
name = "linux-use"
version = "0.1.0"
description = "Fast accessibility-tree (AT-SPI) desktop agent for Linux, with event-driven incremental UI cache; CLI / Python / JSON-RPC for any agent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "linux-use authors" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
linux-use = "linux_use.cli:main"

[project.urls]
Homepage = "https://github.com/mumu-2025/linux-use"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["linux_use*"]
